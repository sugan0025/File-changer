# Builds the Windows installer and publishes it to GitHub Releases.
# Main pushes run verification/builds only. Public releases are published only for v* tags.
#
# Output (build/build-installer.ps1): HOOT-<version>-win-Setup.exe, HOOT-<version>-win-Portable.zip,
# Hoot-win-Portable.zip and HOOT-<version>-SHA256SUMS.txt.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          if ($ref -like 'v*') {
            $version = $ref.TrimStart('v')
            $tag = $ref
          } else {
            $baseVer = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$baseVer.${{ github.run_number }}"
            $tag = ''
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # Windows 11 top-level Explorer menu: FileeExplorerMenu.dll (C, built with a pinned Zig toolchain) and the
      # unsigned sparse package FileeExplorerMenu.msix. Built before the tests so they check the real files.
      - name: Build Explorer menu extension
        shell: pwsh
        run: ./build/build-explorer-menu.ps1 -Version ${{ steps.version.outputs.value }}

      # Same engines as CI, so the release runs the same tests (they are not part of the installer).
      - name: Fetch rhwp, Pandoc and 7-Zip for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,pandoc,7zip

      # Built first and tested like CI: the UI tests on their own with crash and hang blame (a crash names the
      # running test and leaves a dump in TestResults), then the rest.
      - name: Build
        run: dotnet build Filee.slnx -c Release

      - name: Test UI on its own
        run: dotnet test tests/Filee.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.App.Tests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      - name: Sandbox test the Windows installer
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -CheckOnly

      # Publishes the app (Release, self-contained, ReadyToRun) with the Explorer menu extension and the bundled rhwp
      # and 7-Zip and the Microsoft C++ runtime, publishes Setup (one self-contained file), appends the app to it as a
      # checked payload and zips the portable copy.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      # The publish folder and the Setup program as tested, for build/sign-release.ps1 (artifacts leave out hidden
      # folders such as build/.cache, so both are moved into one folder first).
      - name: Keep the unsigned Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Move-Item publish/win-x64 unsigned/app
          Copy-Item build/.cache/setup/Filee.Setup.exe unsigned/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = '${{ steps.version.outputs.tag }}'

          # Stable portable zip for direct download links
          $portable = Get-ChildItem Releases -File -Filter "HOOT-$version-win-Portable.zip" | Select-Object -First 1
          if (-not $portable) { throw "The HOOT Windows portable package is missing for version $version." }
          $stablePortable = Join-Path Releases 'Hoot-win-Portable.zip'
          if (-not (Test-Path $stablePortable)) { Copy-Item $portable.FullName $stablePortable -Force }

          # Stable installer URLs must still be verifiable when GitHub's release API is unavailable.
          $windowsSums = Join-Path Releases "HOOT-$version-win-SHA256SUMS.txt"
          if (-not (Test-Path $windowsSums)) { throw "Windows checksum manifest is missing for $version." }
          $stableSums = Join-Path Releases 'HOOT-win-SHA256SUMS.txt'
          Copy-Item $windowsSums $stableSums -Force
          $stableHash = (Get-FileHash $stablePortable -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $stableSums -Value "$stableHash  Hoot-win-Portable.zip" -Encoding ascii

          $files = Get-ChildItem Releases -File | ForEach-Object FullName
          Write-Host "Releasing files: $($files -join ', ')"

          # Release notes
          $changes = ''
          if (Test-Path CHANGELOG.md) {
            $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
            if ($changelog -match "(?ms)^## $([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^## |\z)") {
              $changes = $Matches[1].Trim() -replace '\r?\n +(?!- |\* |\d+\. )(?=\S)', ' '
            }
          }
          if (-not $changes) { $changes = "Automated HOOT release $version with latest updates." }

          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile "## What's Changed in HOOT $version`n`n$changes" -Encoding utf8

          # Publish only after the Windows tests, installer sandbox check, and package checks above have succeeded.
          $existing = gh release view "$tag" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" --clobber @files
            if ($LASTEXITCODE -ne 0) { throw "Could not upload Windows assets to release $tag." }
            gh release edit "$tag" --draft=false --prerelease=false --latest --title "HOOT $version" --notes-file $notesFile
          } else {
            gh release create "$tag" --title "HOOT $version" --notes-file $notesFile --latest @files
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
